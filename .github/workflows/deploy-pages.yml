name: Deploy Unity Addressables Bundles to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ✅ Checkout with LFS support (downloads real .bundle files)
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # ✅ Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ✅ Upload your repo contents to Pages (root directory)
      - name: Upload site content
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'   # Upload everything (including .bundle files)

      # ✅ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
